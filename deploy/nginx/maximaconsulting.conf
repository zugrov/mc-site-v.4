# maxima consulting — статический лендинг mc-site-v4
# Установка: ln -s /opt/maxima-consulting/apps/mc-site-v.4/deploy/nginx/maximaconsulting.conf /etc/nginx/sites-enabled/
# SSL-блоки управляются Certbot (certificate уже выпущен для maxima-consulting.ru).

server {
    server_name maxima-consulting.ru www.maxima-consulting.ru;

    root /var/www/maxima-consulting/static/mc-site-v4;
    index index.html;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Чистые URL без .html (intent-лендинги)
    location = /financial-diagnostics {
        try_files /financial-diagnostics.html =404;
    }
    location = /nds-2026 {
        try_files /nds-2026.html =404;
    }
    location = /financial-diagnostics.html {
        return 301 /financial-diagnostics;
    }
    location = /nds-2026.html {
        return 301 /nds-2026;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maxima-consulting.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maxima-consulting.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.maxima-consulting.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = maxima-consulting.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name maxima-consulting.ru www.maxima-consulting.ru;
    return 404; # managed by Certbot
}
