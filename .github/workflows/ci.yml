name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            blog-app/package-lock.json

      - name: Тесты сервера
        working-directory: server
        run: npm ci && npm test

      - name: Сборка блога
        working-directory: blog-app
        run: npm ci && npm test && npm run build

      - name: Проверка URL, title и шрифтов
        run: python3 scripts/check_pages.py

      - name: Статический сервер
        run: python3 -m http.server 4173 >/tmp/site-server.log 2>&1 &

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: axe
        run: |
          npm install --no-save --prefix /tmp/axe-run playwright @axe-core/playwright
          cd /tmp/axe-run && npx playwright install --with-deps chromium
          NODE_PATH=/tmp/axe-run/node_modules CHROME_PATH=$(find /tmp/axe-run/node_modules/playwright-core -name chrome -type f | head -1) node ${{ github.workspace }}/scripts/axe_check.mjs
